query GetCustomer($customerAccessToken: String!) {
  customer(customerAccessToken: $customerAccessToken) {
    id
    firstName
    lastName
    email
    phone
    createdAt
    defaultAddress {
      id firstName lastName address1 address2 city province country phone zip
    }
    addresses(first: 10) {
      edges {
        node {
          id
          firstName
          lastName
          address1
          address2
          city
          province
          country
          zip
          phone
        }
      }
    }
    orders(first: 10, sortKey: PROCESSED_AT, reverse: true) {
      edges {
        node {
          id
          orderNumber
          processedAt
          financialStatus
          fulfillmentStatus
          currentTotalPrice { amount currencyCode }
          lineItems(first: 5) {
            edges {
              node {
                title
                quantity
                originalTotalPrice { amount currencyCode }
                variant { id title image { url } }
              }
            }
          }
        }
      }
    }
  }
}
