query GetProduct($id: ID!) {
    product(id: $id) {
        id
        title
        description
        descriptionHtml
        vendor
        productType
        tags
        availableForSale
        priceRange {
            minVariantPrice { amount currencyCode }
            maxVariantPrice { amount currencyCode }
        }
        compareAtPriceRange {
            minVariantPrice { amount currencyCode }
        }
        images(first: 20) {
            edges { node { id url altText width height } }
        }
        options {
            id
            name
            values
        }
        variants(first: 30) {
            edges {
                node {
                    id
                    title
                    availableForSale
                    quantityAvailable
                    price { amount currencyCode }
                    compareAtPrice { amount currencyCode }
                    selectedOptions { name value }
                    image { url altText }
                }
            }
        }
        metafields(identifiers: [
            { namespace: "reviews", key: "rating" },
            { namespace: "reviews", key: "rating_count" },
            { namespace: "reviews", key: "items" }
        ]) {
            key
            namespace
            value
            type

            references(first: 20) {
                edges {
                    node {
                        ... on Metaobject {
                            id
                            customerName: field(key: "customer_name") { value }
                            rating: field(key: "rating") { value }
                            title: field(key: "title") { value }
                            body: field(key: "body") { value }
                            createdAt: field(key: "created_at") { value }
                            approved: field(key: "approved") { value }
                        }
                    }
                }
            }
        }
    }
}