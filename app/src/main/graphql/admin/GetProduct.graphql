query GetProduct($id: ID!) {
    product(id: $id) {
        id
        title
        descriptionHtml
        images(first: 10) {
            edges {
                node {
                    url
                    altText
                }
            }
        }
        variants(first: 20) {
            edges {
                node {
                    id
                    title
                    price
                    inventoryQuantity
                    selectedOptions {
                        name
                        value
                    }
                }
            }
        }
    }
}